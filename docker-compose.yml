services:
  frontend:
    build: .
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      # Helps file watching work reliably when the project folder is bind-mounted (macOS/Windows).
      CHOKIDAR_USEPOLLING: "true"

volumes:
  frontend_node_modules:
